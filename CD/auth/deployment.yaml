apiVersion: apps/v1
kind: Deployment
metadata:
  name: auth-backend-service
  namespace:  dev
spec:
  minReadySeconds: 3
  replicas: 1
  selector:
    matchExpressions:
      - key: app
        operator: In
        values: 
          - auth-backend-service-app
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 1
      maxUnavailable: 1
  template:
    metadata:
      name: auth-backend-service-pod
      labels:
        app: auth-backend-service-app
    spec:
      containers:
        - name: auth-backend-service
          image: 984912521466.dkr.ecr.ap-southeast-1.amazonaws.com/shopflow-auth-service-backend:1.0.0
          envFrom:
            - configMapRef:
                name: auth-backend-service-config
            - secretRef:
                name: auth-backend-service-secret
          imagePullPolicy:  Always

          startupProbe:
            httpGet:
              path: /api/auth/health/
              port: 8000
              httpHeaders:
                - name: Host
                  value: localhost
            failureThreshold: 30
            periodSeconds: 5
            timeoutSeconds: 3

          readinessProbe:
            httpGet:
              path: /api/auth/health/
              port: 8000
              httpHeaders:
                - name: Host
                  value:  localhost
            initialDelaySeconds: 5
            periodSeconds: 10
            timeoutSeconds: 3
            failureThreshold: 1

          livenessProbe:
            httpGet:
              path: /api/auth/health/
              port: 8000
              httpHeaders:
                - name: Host
                  value: localhost
            initialDelaySeconds: 10
            periodSeconds: 20
            timeoutSeconds: 3
            failureThreshold: 3

          ports:
            - containerPort:  8000
              protocol: TCP
          resources:
            requests:
              cpu: "50m"
              memory: "80Mi"
            limits:
              cpu: "80m"
              memory: "100Mi"