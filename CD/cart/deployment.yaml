apiVersion: apps/v1
kind: Deployment
metadata:
  name: cart-backend-service
  namespace:  dev
spec:
  minReadySeconds: 3
  replicas: 2
  selector:
    matchExpressions:
      - key: app
        operator: In
        values: 
          - cart-backend-service-app
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 1
      maxUnavailable: 1
  template:
    metadata:
      name: cart-backend-service-pod
      labels:
        app: cart-backend-service-app
    spec:
      containers:
        - name: cart-backend-service
          image:  
          envFrom:
            - configMapRef:
              name: cart-backend-service-config
            - secrettRef:
              name: cart-backend-service-secret
          imagePullPolicy:  Always
          readinessProbe:
            httpGet:
              path: /
              ports: 8003
          ports:
            - containerPort:  8003
              protocol: TCP
          resources:
            requests:
              cpu: "50m"
              memory: "80Mi"
            limits:
              cpu: "80m"
              memory: "100Mi"