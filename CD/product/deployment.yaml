apiVersion: apps/v1
kind: Deployment
metadata:
  name: product-backend-service
  namespace:  dev
spec:
  minReadySeconds: 3
  # replicas: 2
  selector:
    matchExpressions:
      - key: app
        operator: In
        values: 
          - product-backend-service-app
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 1
      maxUnavailable: 1
  template:
    metadata:
      name: product-backend-service-pod
      labels:
        app: product-backend-service-app
    spec:
      containers:
        - name: product-backend-service
          image: 984912521466.dkr.ecr.ap-southeast-1.amazonaws.com/shopflow-product-service-backend:1.0.0 
          envFrom:
            - configMapRef:
                name: product-backend-service-config
            - secretRef:
                name: product-backend-service-secret
          imagePullPolicy:  Always

          startupProbe:
            httpGet:
              path: /api/product/health/
              port: 8002
              httpHeaders:
                - name: Host
                  value: localhost
            failureThreshold: 30
            periodSeconds: 5

          livenessProbe:
            httpGet:
              path: /api/product/health/
              port: 8002
              httpHeaders:
                - name: Host
                  value: localhost
            initialDelaySeconds: 10
            periodSeconds: 10

          readinessProbe:
            httpGet:
              path: /api/product/health/
              port: 8002
              httpHeaders:
                - name: Host
                  value: localhost
            initialDelaySeconds: 5
            periodSeconds: 10
            
          ports:
            - containerPort:  8002
              protocol: TCP
          resources:
            requests:
              cpu: "50m"
              memory: "80Mi"
            limits:
              cpu: "80m"
              memory: "100Mi"