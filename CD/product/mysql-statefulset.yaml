apiVersion: apps/v1
kind: StatefulSet

metadata:
  name: db_shopflow_products
  namespace: dev

spec:
  minReadySeconds: 3
  replicas: 1
  
  serviceName: db_shopflow_products

  selector:
    matchLabels:
      app: db_shopflow_products
  
  template:
    metadata:
      labels: 
        app: db_shopflow_products

    spec:
      containers:
        - name: mysql
          image: mysql:8.0
          imagePullPolicy:  IfNotPresent

          ports:
            - containerPort: 3306
              protocol: TCP
          
          env:
            - name: MYSQL_DATABASE
              value: shopflow_products

            - name: MYSQL_ROOT_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: product-backend-service-secret
                  key:  DB_PASSSWORD
      
      volumeMounts:
        - name: product-db-storage
          mountPath: /var/lib/mysql
  
  volumeClaimTemplates:
    - metadata: 
      name: product-db-storage

      spec:
        storageClassName: shopflow-product-ebs
        
        accessModes:
          - ReadWriteOnce
        
        resources:
          requests:
            storage:  2Gi
