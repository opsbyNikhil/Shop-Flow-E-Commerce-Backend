apiVersion: apps/v1
kind: Deployment
metadata:
  name: profile-backend-service
  namespace:  dev
spec:
  minReadySeconds: 3
  replicas: 2
  selector:
    matchExpressions:
      - key: app
        operator: In
        values: 
          - profile-backend-service-app
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 1
      maxUnavailable: 1
  template:
    metadata:
      name: profile-backend-service-pod
      labels:
        app: profile-backend-service-app
    spec:
      containers:
        - name: profile-backend-service
          image:  
          envFrom:
            - configMapRef:
              name: profile-backend-service-config
            - secrettRef:
              name: profile-backend-service-secret
          imagePullPolicy:  Always
          readinessProbe:
            httpGet:
              path: /
              ports: 8005
          ports:
            - containerPort:  8005
              protocol: TCP
          resources:
            requests:
              cpu: "50m"
              memory: "80Mi"
            limits:
              cpu: "80m"
              memory: "100Mi"